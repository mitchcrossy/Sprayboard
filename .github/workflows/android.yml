name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check the Android SDK
        run: echo "Android SDK at $ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx @capacitor/assets generate --android --iconBackgroundColor '#a8632c' --splashBackgroundColor '#eceef1'
          npx cap sync android
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../sprayboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sprayboard-apk
          path: sprayboard.apk
      - name: Publish to the "Android app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest sprayboard.apk \
            --title "Sprayboard Android app" \
            --notes "Latest build. On your phone: download sprayboard.apk, open it, and allow installing when Android asks."
